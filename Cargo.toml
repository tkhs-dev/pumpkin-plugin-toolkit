[package]
name = "pumpkin-plugin-toolkit"
version = "0.1.0"
edition = "2024"
description = "Shared helpers for Pumpkin WASM plugins, built on top of pumpkin-plugin-api."

[dependencies]
pumpkin-plugin-api = { version = "0.2.1", git = "https://github.com/Pumpkin-MC/Pumpkin", package = "pumpkin-plugin-api" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
postcard = { version = "1.1.3", features = ["alloc"] }
tracing = "0.1.44"
